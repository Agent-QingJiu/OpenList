name: Build OpenList SPK (DSM 6.2.3)

on:
  workflow_dispatch:
    inputs:
      openlist_ref:
        description: "OpenList upstream branch, tag, or commit"
        required: true
        default: "v4.2.9"
        type: string
  push:
    paths:
      - ".github/workflows/build-spk.yml"
      - "package/**"

permissions:
  contents: read

concurrency:
  group: openlist-spk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bromolow x86_64 SPK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout packaging project
        uses: actions/checkout@v4

      - name: Checkout official OpenList source
        env:
          OPENLIST_REF: ${{ inputs.openlist_ref || 'v4.2.9' }}
        run: |
          git clone --filter=blob:none https://github.com/OpenListTeam/OpenList.git upstream
          git -C upstream fetch --force --tags
          git -C upstream checkout "${OPENLIST_REF}"
          git -C upstream describe --tags --always

      - name: Read upstream Go toolchain version
        id: go
        run: |
          TOOLCHAIN="$(sed -n 's/^toolchain go//p' upstream/go.mod | head -n1)"
          if [ -z "$TOOLCHAIN" ]; then
            TOOLCHAIN="$(sed -n 's/^go //p' upstream/go.mod | head -n1)"
          fi
          echo "version=$TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "Using Go $TOOLCHAIN"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache: false

      - name: Install package icon tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin python3-pil

      - name: Checkout OpenList frontend
        uses: actions/checkout@v4
        with:
          repository: OpenListTeam/OpenList-Frontend
          ref: v4.2.9
          path: frontend

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.28.11"

      - name: Apply hidden-file filtering to folder pickers
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/components/FolderTree.tsx")
          s = p.read_text()
          old_modal = "            autoOpen\n          />"
          new_modal = "            autoOpen\n            showHiddenFolder={false}\n          />"
          old_input = "<FolderTree forceRoot onChange={props.onChange} />"
          new_input = """<FolderTree
                            forceRoot
                            onChange={props.onChange}
                            showHiddenFolder={false}
                          />"""
          if s.count(old_modal) != 1 or s.count(old_input) != 1:
              raise SystemExit("Expected folder-picker call sites not found exactly once; refusing to build.")
          s = s.replace(old_modal, new_modal, 1).replace(old_input, new_input, 1)
          if s.count("showHiddenFolder={false}") < 2:
              raise SystemExit("Hidden-folder filtering patch validation failed.")
          p.write_text(s)
          print("Patched both ModalFolderChoose and FolderChooseInput to honor global hide_files rules.")
          PY
          # Add a Simplified Chinese locale for the initialization wizard.
          # Upstream v4.2.9 currently ships English only; keep all other keys
          # backed by the English dictionary until translated overrides exist.
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path(".")
          lang = root / "src/lang/zh-CN"
          lang.mkdir(parents=True, exist_ok=True)
          (lang / "index.json").write_text(
              json.dumps({"lang": "简体中文"}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          init = {
              "setup_to": "设置",
              "title": "初始化 OpenList",
              "username-tips": "管理员用户名",
              "password-tips": "设置管理员密码",
              "confirm_password-tips": "确认密码",
              "site_title-tips": "站点名称",
              "setup": "初始化",
              "success": "初始化成功，请登录",
              "failed": "初始化失败",
              "password_mismatch": "两次输入的密码不一致",
              "password_too_short": "密码至少需要 4 个字符",
              "creating_account": "正在创建管理员账户……",
              "waiting_storage": "正在等待存储同步……",
              "storage_ready": "存储已就绪",
              "waiting_storage_tip": "云端 KV 存储存在同步延迟，请稍候（通常只需几秒）",
              "waiting_timeout": "存储同步超时。请尝试登录；如果失败，请稍后重试",
              "env_check": "环境检查",
              "env_check_loading": "正在检查环境……",
              "env_check_ready": "环境已就绪",
              "env_check_not_ready": "环境尚未就绪",
              "env_check_refresh": "重新检查",
              "env_runtime": "运行环境",
              "env_serverless": "无服务器环境",
              "env_local": "本地 / 容器",
              "env_format": "存储格式",
              "env_driver": "数据库驱动",
              "env_resolved": "解析结果",
              "env_storage": "存储",
              "env_jwt": "JWT 密钥",
              "env_status_ok": "就绪",
              "env_status_bad": "未就绪",
              "env_doc_link": "文档",
              "env_fix_title": "解决方法",
              "env_blocked_tip": "请先解决上述问题，然后继续。",
              "env_deploy_docs": "部署指南：",
              "step_env": "步骤 1 · 环境检查",
              "step_account": "步骤 2 · 管理员账户",
              "step_done": "步骤 3 · 完成",
              "next": "下一步",
              "back": "返回",
              "env_continue": "继续",
              "env_next_tip": "环境检查通过后，即可继续创建管理员账户。",
              "finalizing": "正在完成初始化……",
              "finalizing_tip": "请保持此页面打开，直到初始化完成。",
              "done_title": "初始化完成",
              "done_subtitle": "OpenList 已准备就绪，可以开始使用。",
              "done_username": "管理员用户名",
              "done_site_url": "站点地址",
              "done_go_login": "前往登录",
              "done_go_home": "打开首页",
              "timeout_title": "仍在同步",
              "timeout_tip": "管理员账户已创建，但后端尚未确认存储就绪。你可以重新检查，或现在尝试登录。",
              "error_title": "初始化失败",
              "error_code": "错误代码",
              "storage_issue_title": "检测到存储问题",
              "storage_issue_hint": "请修复存储配置，然后重新检查环境再试。",
          }
          (lang / "init.json").write_text(
              json.dumps(init, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (lang / "entry.ts").write_text(
              'import { dict as en } from "~/lang/en/entry"\n'
              'import init from "./init.json"\n'
              '\n'
              'export const dict = { ...en, init }\n',
              encoding="utf-8",
          )

          i18n = Path("src/app/i18n.ts")
          text = i18n.read_text(encoding="utf-8")
          old = 'export let initialLang = localStorage.getItem("lang") ?? defaultLang'
          new = '''const savedLang = localStorage.getItem("lang")
          const browserPrefersChinese =
            userLang.startsWith("zh") && languages.some((lang) => lang.code === "zh-CN")
          export let initialLang =
            savedLang === "en" && browserPrefersChinese
              ? "zh-CN"
              : savedLang ?? defaultLang'''
          if old not in text:
              raise SystemExit("Could not locate initial language selection")
          i18n.write_text(text.replace(old, new, 1), encoding="utf-8")

          switcher = Path("src/components/SwitchLanguage.tsx")
          text = switcher.read_text(encoding="utf-8")
          text = text.replace(
              'import { Lang, languages, setCurrentLang } from "~/app/i18n"',
              'import { Lang, initialLang, languages, setCurrentLang } from "~/app/i18n"',
              1,
          )
          old = '''    switchLang(
                    languages.find((l) => l.code === navigator.language)
                      ? navigator.language
                      : "en",
                  )'''
          if old not in text:
              raise SystemExit("Could not locate language switcher initial selection")
          text = text.replace(old, "    switchLang(initialLang)", 1)
          switcher.write_text(text, encoding="utf-8")
          print("Added zh-CN locale; initialization wizard defaults to Simplified Chinese on Chinese browsers.")
          PY
          pnpm install --frozen-lockfile
          pnpm build
          test -s dist/index.html

      - name: Build OpenList backend with patched frontend
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p bin
          rm -rf public/dist
          mkdir -p public/dist
          cp -a ../frontend/dist/. public/dist/
          test -s public/dist/index.html
          echo "Patched frontend bundle embedded from OpenList-Frontend:"
          find public/dist -maxdepth 2 -type f | sed -n '1,20p'

          BUILT_AT="$(date +'%F %T %z')"
          GIT_AUTHOR="The OpenList Projects Contributors <noreply@oplist.org>"
          GIT_COMMIT="$(git log --pretty=format:%h -1)"
          VERSION="$(git describe --abbrev=0 --tags 2>/dev/null || echo v0.0.0)"
          WEB_VERSION="custom-folder-hide-filter"
          LDFLAGS="-w -s -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=${BUILT_AT}' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=${GIT_AUTHOR}' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=${GIT_COMMIT}' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=${VERSION}' -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=${WEB_VERSION}'"

          # DSM 6.2.3 has an older glibc; CGO-disabled Go build stays portable.
          CGO_ENABLED=0 go build -o bin/openlist -ldflags="${LDFLAGS}" -tags=jsoniter .
          test -s bin/openlist
          file bin/openlist
          readelf -h bin/openlist | grep -E 'Class:|Machine:'
          if readelf -l bin/openlist | grep -q 'Requesting program interpreter'; then
            echo "ERROR: OpenList binary is dynamically linked."
            readelf -l bin/openlist | grep 'Requesting program interpreter' || true
            exit 1
          fi
          if readelf -d bin/openlist 2>/dev/null | grep -q '(NEEDED)'; then
            echo "ERROR: OpenList binary still has dynamic library dependencies."
            readelf -d bin/openlist | grep '(NEEDED)' || true
            exit 1
          fi
          echo "Verified: patched frontend embedded and backend has no dynamic dependencies."

      - name: Assemble Synology SPK
        id: package
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          VERSION="$(git -C upstream describe --tags --abbrev=0 2>/dev/null || git -C upstream rev-parse --short HEAD)"
          VERSION="${VERSION#v}"
          SAFE_VERSION="$(printf '%s' "$VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          # Synology requires a monotonically increasing package build number.
          # Keep the upstream app version visible, and append this workflow's
          # increasing run number so DSM accepts in-place upgrades.
          BUILD_NUMBER="$(printf '%04d' "$RUN_NUMBER")"
          SAFE_VERSION="${SAFE_VERSION}-${BUILD_NUMBER}"
          STAGE="$RUNNER_TEMP/spk"
          PAYLOAD="$STAGE/payload"
          mkdir -p "$PAYLOAD/bin" "$STAGE/scripts"

          install -m 0755 upstream/bin/openlist "$PAYLOAD/bin/openlist"
          install -m 0644 upstream/LICENSE "$PAYLOAD/LICENSE"
          printf '%s\n' "$VERSION" > "$PAYLOAD/VERSION"

          sed "s/@VERSION@/$SAFE_VERSION/g" package/INFO.template > "$STAGE/INFO"

          # DSM 6.x uses a 72x72 package icon; the 256px variant is also
          # included for newer DSM versions. Keep both at the SPK root.
          # Use the official full-color PNG app icon, not logo.svg's
          # monochrome/technical mark. The repository provides pre-rendered
          # square PNG assets generated from its original Illustrator artwork.
          curl -fsSL https://raw.githubusercontent.com/OpenListTeam/Logo/main/logo/256x256.png -o "$STAGE/openlist-color.png"
          python3 - "$STAGE/openlist-color.png" "$STAGE/PACKAGE_ICON.PNG" "$STAGE/PACKAGE_ICON_256.PNG" "$STAGE/INFO" <<'PY'
          import base64
          import sys
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          source = Image.open(sys.argv[1]).convert("RGBA")
          if source.getbbox() is None:
              raise SystemExit("ERROR: official OpenList color icon is empty")

          # DSM's small package-list icon handles transparent RGBA correctly.
          icon72 = source.resize((72, 72), Image.Resampling.LANCZOS)
          icon72.save(sys.argv[2], "PNG", optimize=True)

          # The detail-page renderer on this DSM 6 target displays transparent
          # 256px icons as a black mask. Flatten only this larger icon onto
          # white, preserving the official blue/mint RGB artwork.
          icon256 = source.resize((256, 256), Image.Resampling.LANCZOS)
          white = Image.new("RGBA", icon256.size, (255, 255, 255, 255))
          white.alpha_composite(icon256)
          opaque256 = white.convert("RGB")
          opaque256.save(sys.argv[3], "PNG", optimize=True)

          check72 = Image.open(sys.argv[2])
          check256 = Image.open(sys.argv[3])
          if check72.size != (72, 72) or check72.mode != "RGBA":
              raise SystemExit("ERROR: 72px icon validation failed")
          if check256.size != (256, 256) or check256.mode != "RGB":
              raise SystemExit("ERROR: 256px icon must be opaque RGB")
          colors = opaque256.getcolors(256 * 256) or []
          if len(colors) < 3:
              raise SystemExit("ERROR: 256px icon lost its full-color artwork")

          # Also refresh the authoritative DSM 256px INFO field so an upgrade
          # cannot keep an older cached package_icon_256 value.
          buf = BytesIO()
          opaque256.save(buf, format="PNG", optimize=True)
          encoded = base64.b64encode(buf.getvalue()).decode("ascii")
          with open(sys.argv[4], "a", encoding="utf-8") as info:
              info.write(f'package_icon_256="{encoded}"\n')

          print(f"Verified list icon: {sys.argv[2]} ({check72.mode}, {check72.size})")
          print(f"Verified detail icon: {sys.argv[3]} ({check256.mode}, {check256.size}, {len(colors)} colors, opaque)")
          print(f"Verified INFO package_icon_256: {len(encoded)} base64 chars")
          PY
          rm -f "$STAGE/openlist-color.png"
          file "$STAGE/PACKAGE_ICON.PNG" "$STAGE/PACKAGE_ICON_256.PNG"
          test -s "$STAGE/PACKAGE_ICON.PNG"
          test -s "$STAGE/PACKAGE_ICON_256.PNG"

          install -m 0755 package/scripts/start-stop-status "$STAGE/scripts/start-stop-status"
          install -m 0755 package/scripts/postinst "$STAGE/scripts/postinst"
          install -m 0755 package/scripts/preuninst "$STAGE/scripts/preuninst"

          tar -czf "$STAGE/package.tgz" -C "$PAYLOAD" .
          tar -cf "OpenList-${SAFE_VERSION}-DSM6.2.3-bromolow.spk" -C "$STAGE" INFO package.tgz scripts PACKAGE_ICON.PNG PACKAGE_ICON_256.PNG

          tar -tf "OpenList-${SAFE_VERSION}-DSM6.2.3-bromolow.spk"
          tar -xOf "OpenList-${SAFE_VERSION}-DSM6.2.3-bromolow.spk" INFO | awk -F= '
            $1 == "package_icon" { print "SPK INFO: package_icon present (" length($2) " chars)" }
            $1 == "package_icon_256" { print "SPK INFO: package_icon_256 present (" length($2) " chars)" }
          '
          echo "version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "spk=OpenList-${SAFE_VERSION}-DSM6.2.3-bromolow.spk" >> "$GITHUB_OUTPUT"

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenList-${{ steps.package.outputs.version }}-DSM6.2.3-bromolow
          path: ${{ steps.package.outputs.spk }}
          if-no-files-found: error
          retention-days: 30
